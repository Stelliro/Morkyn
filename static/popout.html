<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mørkyn — Popout</title>
    <link rel="stylesheet" href="/static/ui/tokens.css?v=__BUNDLE__" />
    <link rel="stylesheet" href="/static/styles.css?v=__BUNDLE__" />
    <link rel="stylesheet" href="/static/ui/skin.css?v=__BUNDLE__" />
    <style>
      html, body { height: 100%; min-height: 100%; }
      body.popoutBody {
        margin: 0;
        height: 100%;
        min-height: 100%;
        display: flex;
        background: var(--bg);
      }
      .popoutShell {
        width: 100%;
        max-width: none;
        min-height: 100%;
        margin: 0;
        padding: 12px 16px 16px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .popoutBodyContent {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }
      .popoutHeader {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: start;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid color-mix(in srgb, var(--neon) 28%, var(--line));
      }
      .popoutHeader h1 {
        margin: 0;
        font-size: 1.35rem;
        letter-spacing: 0.04em;
        color: var(--accent);
      }
      .popoutHeader p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .popoutBodyContent {
        display: grid;
        gap: 12px;
      }
      .popoutBodyContent .statGrid {
        /* auto-fit, not auto-fill: the tiles stretch across like the in-game sheet
           instead of leaving empty tracks on the right. */
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      }
      .popoutBodyContent .card,
      .popoutBodyContent article {
        border: 1px solid color-mix(in srgb, var(--neon-2) 18%, var(--line));
        box-shadow: 0 0 18px rgba(0,0,0,0.2);
      }
      .popoutStatus {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .popoutStatus.live { color: var(--neon-2); }
    </style>
  </head>
  <body class="popoutBody">
    <noscript>
      <div style="max-width:520px;margin:24px auto;padding:18px;border:1px solid #303940;border-radius:10px;background:#171b1f;color:#d8dcd9;font:15px/1.5 system-ui,sans-serif">
        <strong>JavaScript is required.</strong>
        This pop-out window shows a part of the game that runs on this computer (<code>127.0.0.1</code>); its script
        is in this page, <code>static/popout.html</code>. No analytics, no tracking, no phone home; updates from GitHub
        are the only exception. The main Mørkyn page explains every script and what it does.
      </div>
    </noscript>
    <div class="popoutShell">
      <header class="popoutHeader">
        <div>
          <h1 id="popoutTitle">Panel</h1>
          <p id="popoutSub">Detached reference window</p>
        </div>
        <div>
          <span id="popoutLive" class="popoutStatus">Connecting…</span>
          <button type="button" class="secondaryButton" id="popoutRefresh">Refresh</button>
          <button type="button" class="secondaryButton" id="popoutClose">Close</button>
        </div>
      </header>
      <main id="popoutContent" class="popoutBodyContent">
        <p class="empty">Loading…</p>
      </main>
    </div>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const tab = (params.get("tab") || "player").toLowerCase();
        // native=1: opened by Mørkyn's own app as a separate window. There is
        // no window.opener, so content and clicks travel over this channel.
        const native = params.get("native") === "1";
        const channel = native && typeof BroadcastChannel === "function" ? new BroadcastChannel("morkyn-popout") : null;
        const openedAt = Date.now();
        let lastPush = 0;
        const titles = {
          player: "Player",
          inventory: "Inventory",
          bible: "World Bible",
          search: "Search",
          model: "Model",
          npcs: "NPCs",
          items: "Items",
          places: "Places",
          events: "Events",
          talk: "Talk",
          drafts: "Checks",
          history: "History",
        };
        document.title = "Mørkyn — " + (titles[tab] || tab);
        document.getElementById("popoutTitle").textContent = titles[tab] || tab;
        document.getElementById("popoutSub").textContent = "Popped out · stays in sync with the main window when possible";

        const content = document.getElementById("popoutContent");
        const live = document.getElementById("popoutLive");
        let lastHtml = "";

        function setLive(text, ok) {
          live.textContent = text;
          live.classList.toggle("live", Boolean(ok));
        }

        function applyTheme(theme) {
          if (theme) document.documentElement.setAttribute("data-theme", theme);
        }

        function renderFromParent() {
          try {
            const opener = window.opener;
            if (!opener || opener.closed) return false;
            if (typeof opener.renderTabHtmlForPopout === "function") {
              const html = opener.renderTabHtmlForPopout(tab);
              if (html && html !== lastHtml) {
                content.innerHTML = html;
                lastHtml = html;
              }
              if (typeof opener.getUiTheme === "function") applyTheme(opener.getUiTheme());
              setLive("Live · linked to main window", true);
              return true;
            }
          } catch (e) {
            /* cross-origin or closed */
          }
          return false;
        }

        async function renderFromApi() {
          try {
            const res = await fetch("/api/state", { cache: "no-store" });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const state = await res.json();
            // Minimal standalone render for when opener is gone
            const player = state.player || {};
            const loc = state.current_location || {};
            if (tab === "player") {
              content.innerHTML =
                '<div class="statGrid">' +
                cardStat("Health", (player.health ?? 0) + "/" + (player.max_health ?? 0)) +
                (player.energy != null || (state.resources && state.resources.energy != null)
                  ? cardStat("Energy", (player.energy ?? state.resources?.energy ?? 0) + "/" + (player.max_energy ?? state.resources?.max_energy ?? 0))
                  : "") +
                ((player.max_mana > 0) || (state.resources && state.resources.max_mana > 0)
                  ? cardStat("Mana", (player.mana ?? state.resources?.mana ?? 0) + "/" + (player.max_mana ?? state.resources?.max_mana ?? 0))
                  : "") +
                (player.fatigue != null || (state.resources && state.resources.fatigue != null)
                  ? cardStat("Fatigue", (player.fatigue ?? state.resources?.fatigue ?? 0) + "/" + (player.max_fatigue ?? state.resources?.max_fatigue ?? 0))
                  : "") +
                cardStat("Level", player.level ?? 1) +
                cardStat("XP", player.xp ?? 0) +
                cardStat("Gold", player.gold ?? 0) +
                cardStat("Karma", player.karma ?? 0) +
                "</div>" +
                section("Location", (loc.name || "?") + " — " + (loc.summary || "")) +
                section("Identity", [player.name, player.title, player.public_name].filter(Boolean).join(" · ") || "—") +
                section("Backstory", player.backstory || "—");
            } else if (tab === "inventory") {
              const items = state.inventory || [];
              content.innerHTML = items.length
                ? items.map((i) => section(i.name || "item", "qty " + (i.quantity ?? 0) + " · " + (i.rarity || "common") + (i.equipped_slot ? " · " + i.equipped_slot : ""))).join("")
                : '<p class="empty">Empty pack.</p>';
            } else if (tab === "npcs") {
              const rows = [];
              (state.locations || []).forEach((place) => {
                (place.npcs || []).forEach((n) => rows.push(section(n.name || "NPC", (place.name || "") + " · " + (n.role || "") + " — " + (n.summary || ""))));
              });
              content.innerHTML = rows.join("") || '<p class="empty">No NPCs.</p>';
            } else if (tab === "places") {
              content.innerHTML = (state.locations || []).map((p) => section(p.name || p.code, p.summary || "")).join("") || '<p class="empty">No places.</p>';
            } else if (tab === "events") {
              content.innerHTML = (state.events || []).map((e) => section(e.title || e.code || "Event", e.summary || e.status || "")).join("") || '<p class="empty">No events.</p>';
            } else {
              content.innerHTML = section("State snapshot", "Tab <code>" + tab + "</code> — open from main window for full interactive view, or keep this as a live mirror when linked.");
            }
            setLive("API snapshot · " + new Date().toLocaleTimeString(), true);
          } catch (e) {
            content.innerHTML = '<p class="empty">Could not load: ' + String(e.message || e) + "</p>";
            setLive("Disconnected", false);
          }
        }

        function cardStat(label, value) {
          return '<div class="statCard"><span>' + esc(label) + "</span><strong>" + esc(value) + "</strong></div>";
        }
        function section(title, body) {
          return '<article class="card"><header><strong>' + esc(title) + "</strong></header><p>" + esc(body) + "</p></article>";
        }
        function esc(s) {
          return String(s ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function forwardToOpener(payload) {
          if (channel) {
            channel.postMessage(Object.assign({ type: "morkyn-popout-action", tab: tab }, payload));
            return;
          }
          const opener = window.opener;
          if (!opener || opener.closed) return;
          opener.postMessage(Object.assign({ type: "morkyn-popout-action" }, payload), location.origin);
        }

        content.addEventListener("click", (event) => {
          if (tab !== "history") return;
          const pageBtn = event.target.closest("button[data-history-page]");
          const linkBtn = event.target.closest(".insertRefButton");
          if (!pageBtn && !linkBtn) return;
          if (pageBtn && pageBtn.disabled) return;
          event.preventDefault();
          if (pageBtn) {
            forwardToOpener({ action: "history-page", dir: pageBtn.getAttribute("data-history-page") || "" });
            return;
          }
          forwardToOpener({
            action: "insert-ref",
            linkToken: linkBtn.getAttribute("data-link-token") || "",
            linkType: linkBtn.getAttribute("data-type") || "",
            linkCode: linkBtn.getAttribute("data-code") || "",
          });
        });

        content.addEventListener("toggle", (event) => {
          const details = event.target;
          if (!details || details.nodeType !== 1 || !details.getAttribute("data-history-key")) return;
          forwardToOpener({
            action: "history-toggle",
            key: details.getAttribute("data-history-key"),
            open: !!details.open,
          });
        }, true);

        function tick() {
          if (channel) {
            // The main window pushes on every change; ask again when it has
            // been quiet, and fall back to a snapshot only if nobody answers.
            const quiet = Date.now() - Math.max(lastPush, openedAt);
            if (quiet > 6000) channel.postMessage({ type: "morkyn-popout-hello", tab: tab });
            if (quiet > 12000 && !lastHtml) renderFromApi();
            return;
          }
          if (!renderFromParent()) renderFromApi();
        }
        function applyPush(data) {
          if (!data || data.type !== "morkyn-popout") return;
          if (data.tab !== tab) return;
          if (data.theme) applyTheme(data.theme);
          if (data.html) {
            lastPush = Date.now();
            if (data.html !== lastHtml) content.innerHTML = data.html;
            lastHtml = data.html;
            setLive("Live · linked to main window", true);
          }
        }
        if (channel) {
          channel.onmessage = (ev) => applyPush(ev.data);
          channel.postMessage({ type: "morkyn-popout-hello", tab: tab });
          window.addEventListener("pagehide", () => channel.postMessage({ type: "morkyn-popout-bye", tab: tab }));
        }
        tick();
        setInterval(tick, 1500);
        document.getElementById("popoutRefresh").onclick = () => {
          if (channel) {
            lastPush = 0;
            channel.postMessage({ type: "morkyn-popout-hello", tab: tab });
          } else tick();
        };
        document.getElementById("popoutClose").onclick = () => {
          const api = window.pywebview && window.pywebview.api;
          if (native && api && api.close_popout) api.close_popout(tab);
          else window.close();
        };
        window.addEventListener("message", (ev) => applyPush(ev.data));
      })();
    </script>
    <script src="/static/ui/frame.js?v=__BUNDLE__"></script>
  </body>
</html>
