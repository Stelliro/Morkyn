name: Package

# Builds the app folder for Windows, Linux and macOS on every v* tag (and on
# request) and attaches the archives to that tag's GitHub release. The app does
# not ship llama-cpp-python: the "packs" job builds it per accelerator and
# attaches those to the standing "runtime-packs" release (app/runtime_packs.py).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      packs:
        description: "Also rebuild the runtime packs"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-14
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install the app's requirements (no llama-cpp-python: it is a runtime pack)"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v -i "llama-cpp-python\|extra-index-url" requirements.txt > /tmp/req.txt
          python -m pip install -r /tmp/req.txt
      - name: Install the macOS window
        if: matrix.name == 'macos'
        run: python -m pip install "pywebview>=6.2"
      - name: Build (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging/build.ps1 -Python python
      - name: Build (Linux/macOS)
        if: matrix.name != 'windows'
        run: bash packaging/build.sh --python python
      - name: Linux packages (.deb, .rpm, AppImage, AUR PKGBUILD)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm fakeroot
          bash packaging/build_linux.sh deb rpm appimage aur
      - name: The AUR files (pushed to aur.archlinux.org by hand, not attached)
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Morkyn-aur
          path: dist/aur/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: Morkyn-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/*.tar.gz dist/*.deb dist/*.rpm dist/*.AppImage --clobber

  packs:
    if: github.event_name == 'workflow_dispatch' && inputs.packs
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            acc: cuda
          - os: windows-latest
            acc: cpu
          - os: ubuntu-22.04
            acc: cuda
          - os: ubuntu-22.04
            acc: cpu
          - os: macos-14
            acc: metal
          - os: macos-15-intel
            acc: cpu
          # The local speech engine add-on (Piper), one per platform.
          - os: windows-latest
            acc: piper
          - os: ubuntu-22.04
            acc: piper
          - os: macos-14
            acc: piper
          - os: macos-15-intel
            acc: piper
          # The Linux window (pywebview on Qt WebEngine); Windows and macOS ship theirs.
          - os: ubuntu-22.04
            acc: window
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pack
        run: python packaging/build_packs.py ${{ matrix.acc }} --out dist/packs
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.acc }}-${{ matrix.os }}
          path: dist/packs/*.zip
          if-no-files-found: error
      - name: Attach to the runtime-packs release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # The pack jobs run at once: another job may create the release between the view and the create.
          gh release view runtime-packs >/dev/null 2>&1 || gh release create runtime-packs --title "Runtime packs" --notes "The llama.cpp engine packs Mørkyn downloads for your hardware (Versions & engine in the game). One per accelerator, platform and Python tag; the app picks the one that fits." --prerelease \
            || gh release view runtime-packs >/dev/null
          gh release upload runtime-packs dist/packs/*.zip --clobber
